<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de asistencias</title>
    
    <!-- Enlace al CSS dentro de la carpeta css -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Librería externa para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <h1>Control de asistencias</h1>
    <p>Bienvenido al sistema de registro estudiantil</p>

    <div class="dashboard-container">

        <!-- LECTOR DE QR -->
        <div class="card">
            <h2>Lector de QR</h2>
            <p style="text-align: left; margin-bottom: 10px;">Escanee el carnet o escriba el código y presione Enter:</p>
            <input type="text" id="inputLector" placeholder="Escriba el código aquí..." autofocus autocomplete="off">
            <div id="mensajeLector" class="alerta"></div>
        </div>

        <!-- REGISTRAR ESTUDIANTE -->
        <div class="card">
            <h2>Registrar estudiante</h2>
            <form id="formEstudiante">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan">

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" required placeholder="Ej. Pérez">

                <label for="codigo">Código:</label>
                <input type="text" id="codigo" required placeholder="Ej. 001">

                <button type="submit">Registrar estudiante</button>
            </form>
            <div id="mensajeRegistro" class="alerta"></div>
        </div>

        <!-- ESTUDIANTES REGISTRADOS -->
        <div class="card">
            <h2>Estudiantes registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>QR</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaEstudiantes"></tbody>
            </table>
        </div>

        <!-- HISTORIAL DE ASISTENCIA -->
        <div class="card">
            <h2>Historial de asistencia</h2>
            <div style="margin-bottom: 15px;">
                <label for="filtroFecha">Filtrar por fecha:</label>
                <input type="date" id="filtroFecha">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Estudiante</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="tablaAsistencia"></tbody>
            </table>
        </div>

    </div>

    <!-- Enlace al JS dentro de la carpeta js -->
    <script src="js/script.js"></script>
</body>
</html>
